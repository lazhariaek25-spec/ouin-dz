name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "رابط المنصة العام (https://...)"
        required: false
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: مفتاح التوقيع (مرة واحدة)
        run: |
          [ -f android/app/ouin.keystore ] || keytool -genkeypair -keystore android/app/ouin.keystore \
            -storepass android -keypass android -alias ouin -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Ouin DZ"
      - name: بناء APK
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL }}
        run: cd android && gradle assembleRelease --no-daemon
      - name: نسخ APK
        run: |
          mkdir -p frontend/downloads
          cp android/app/build/outputs/apk/release/app-release.apk frontend/downloads/ouin-dz.apk
      - uses: actions/upload-artifact@v4
        with: { name: ouin-dz-apk, path: frontend/downloads/ouin-dz.apk }
      - name: حفظ APK في المستودع
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f frontend/downloads/ouin-dz.apk android/app/ouin.keystore
          git commit -m "build: APK [skip ci]" || echo "لا تغيير"
          git push
